<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#0f041c" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.1" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="280" height="360" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes continuousSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes shineMove {
      0% { transform: translateX(-300px) rotate(25deg); }
      100% { transform: translateX(400px) rotate(25deg); }
    }
    .lanyard-wrapper {
      transform-origin: 200px 0px;
      animation: continuousSway 4s ease-in-out infinite;
    }
    .badge-card { fill: url(#glassGrad); stroke: #ff2a8d; stroke-width: 1.5; }
    .shine-bar { animation: shineMove 3.5s infinite linear; }
  </style>

  <g class="lanyard-wrapper">
    <rect x="185" y="0" width="30" height="135" fill="url(#strapGrad)" rx="4" />
    <text x="200" y="68" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle" transform="rotate(-90 200 68)" letter-spacing="1">UMAIMA HAMEED - BS AI</text>

    <rect x="180" y="130" width="40" height="14" rx="3" fill="#d1d5db" />
    <circle cx="200" cy="152" r="10" fill="none" stroke="#9ca3af" stroke-width="4" />

    <g transform="translate(60, 165)">
      <rect class="badge-card" width="280" height="360" rx="20" />

      <g clip-path="url(#cardClip)">
        <rect class="shine-bar" x="0" y="0" width="120" height="400" fill="url(#shineGrad)" />
      </g>

      <circle cx="140" cy="105" r="55" fill="#1a0833" stroke="#00f5d4" stroke-width="3" />
      <circle cx="140" cy="90" r="22" fill="#ff2a8d" />
      <path d="M 105,140 Q 140,110 175,140 Z" fill="#ff2a8d" />

      <text x="140" y="195" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">Umaima Hameed</text>
      <text x="140" y="220" font-family="monospace" font-size="13" fill="#00f5d4" text-anchor="middle">@little.but.dev</text>
      <text x="140" y="245" font-family="sans-serif" font-size="12" fill="#e0aaff" text-anchor="middle">Full-Stack and AI Developer</text>

      <g transform="translate(65, 275)" fill="#ff2a8d">
        <rect x="0" width="3" height="32" /><rect x="6" width="6" height="32" /><rect x="16" width="2" height="32" />
        <rect x="22" width="8" height="32" /><rect x="34" width="4" height="32" /><rect x="42" width="2" height="32" />
        <rect x="48" width="7" height="32" /><rect x="60" width="3" height="32" /><rect x="68" width="5" height="32" />
        <rect x="78" width="2" height="32" /><rect x="84" width="8" height="32" /><rect x="96" width="4" height="32" />
        <rect x="105" width="6" height="32" /><rect x="115" width="3" height="32" /><rect x="122" width="8" height="32" />
        <rect x="135" width="2" height="32" /><rect x="142" width="6" height="32" />
      </g>
    </g>
  </g>
</svg>
